name: HR-System
services:
  # ==================== MSSQL Server ====================
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-server
    environment:
      - ACCEPT_EULA=${ACCEPT_EULA:-Y}
      - SA_PASSWORD=${SA_PASSWORD:?SA_PASSWORD is required}
      - MSSQL_PID=${MSSQL_PID:-Developer}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -Q ''SELECT 1'' -b -o /dev/null -C',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - hr-network

  # ==================== Redis Cache ====================
  redis:
    image: redis:alpine
    container_name: hr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - hr-network

  # ==================== Backend (Node.js + Express) ====================
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: hr-backend
    environment:
      - PORT=5000
      - DB_HOST=mssql
      - DB_PORT=1433
      - DB_USER=${DB_USER:-sa}
      - DB_PASSWORD=${SA_PASSWORD:?SA_PASSWORD is required}
      - DB_DATABASE=${DB_DATABASE:-HRManagement}
      - DB_DIALECT=mssql
      - CLIENT_URL=http://localhost
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:-access_secret_key}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-refresh_secret_key}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "5000:5000"
    volumes:
      - backend-uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hr-network

  # ==================== Frontend (React + Nginx) ====================
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: hr-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - hr-network

volumes:
  mssql-data:
  backend-uploads:
  redis-data:

networks:
  hr-network:
    driver: bridge
